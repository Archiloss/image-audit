body { font-family: -apple-system, "PingFang SC", sans-serif; background: #f5f6f7; color: #222; }

#exportBtn { background: #1677ff; color: #fff; }
#resetBtn { background: #eee; color: #333; }

.cell.bad img { border-color: #ff4d4f; }

.cell .s.normal { background: #52c41a; }
.cell .s.repeat { background: #722ed1; }
.cell .d { position: absolute; bottom: 4px; right: 4px; font-size: 10px; background: rgba(0,0,0,.6); color: #fff; padding: 1px 5px; border-radius: 3px; }
.cell .b { position: absolute; bottom: 4px; left: 4px; font-size: 10px; font-weight: 700; color: #fff; padding: 1px 5px; border-radius: 3px; background: var(--bc); display: none; }
.cell.bad .b { display: none; }
.cell .x { position: absolute; top: 4px; right: 4px; font-size: 10px; font-weight: 700; background: #ff4d4f; color: #fff; padding: 1px 5px; border-radius: 3px; display: none; }
.cell.bad .x { display: block; }
.cell.dim img { opacity: .55; }
.cell.dim .d { opacity: .4; }
.cell.dim .b, .cell.dim .x, .cell.dim .s { opacity: 1 !important; }
.cell.dim.in-batch { outline: 2px solid var(--bc); outline-offset: 1px; }
.btns { margin-top: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.btns button.ok { background: #52c41a; color: #fff; }
.btns button.no { background: #ff4d4f; color: #fff; }
.btns button.part { background: #faad14; color: #fff; }
.btns button.skip { background: #d9d9d9; color: #333; }
.btns button.newb { background: #1677ff; color: #fff; }
.btns .batchbar { display: inline-flex; gap: 4px; align-items: center; }
.btns .batchbar .bb { background: #e6f4ff; color: #1677ff; padding: 3px 10px; border-radius: 4px; font-size: 12px; position: relative; }
.btns .batchbar .bball { background: #f0f0f0; color: #333; padding: 3px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btns .batchbar .bball.sel { background: #1677ff; color: #fff; outline: 2px solid #000; }
.btns .batchbar .bbad { background: #fff1f0; color: #ff4d4f; padding: 3px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.btns .batchbar .bbad.sel { background: #ff4d4f; color: #fff; outline: 2px solid #000; }
.btns .batchbar .bb.selb { background: var(--bc); color: #fff; outline: 2px solid #000; }
.btns .batchbar .bb.selview { box-shadow: 0 0 0 2px #000 inset; }
.btns .batchbar .bdel { margin-left: 5px; cursor: pointer; font-weight: 700; color: #ff4d4f; padding: 0 2px; border-radius: 2px; }
.btns .batchbar .bb.selb .bdel { color: #fff; }
.btns .batchbar .bdel:hover { background: #ff4d4f; color: #fff; }
.hint { font-size: 12px; color: #999; }
.boundary-wrap { background: #fffbe6; border: 1px solid #ffe58f; border-radius: 10px; margin: 14px 16px; padding: 14px; }

.bcell .info { font-size: 11px; color: #666; margin-top: 3px; word-break: break-all; }
.bcell .bmark { position: absolute; top: 4px; right: 4px; font-size: 10px; font-weight: 700; background: #ff4d4f; color: #fff; padding: 1px 5px; border-radius: 3px; }

": [68], "n_t": 1}, {"i": 1492, "u": "a03eef4b-162d-4a7a-b32d-41e6bd42959c", "src": "重复", "targets": [1633], "gids": [61], "n_t": 1}, {"i": 967, "u": "69bcfaff-b905-485d-bbba-a43cece6f40c", "src": "重复", "targets": [1887], "gids": [1], "n_t": 1}, {"i": 1178, "u": "cce0d43c-8c87-4900-b8ed-56bab854e504", "src": "重复", "targets": [1806], "gids": [33], "n_t": 1}, {"i": 1319, "u": "1ae1b4e0-a8dd-4fd2-95f8-e3e10b0217a3", "src": "重复", "targets": [1406], "gids": [33], "n_t": 1}, {"i": 999, "u": "41f9f496-db8c-47ba-8778-c71dea841bd9", "src": "重复", "targets": [1486], "gids": [34], "n_t": 1}, {"i": 1010, "u": "44b8866e-9342-4ad2-944d-c70a44094ab5", "src": "重复", "targets": [1685], "gids": [20], "n_t": 1}, {"i": 1034, "u": "277fe7cb-cafb-4444-95b7-fefc0900127c", "src": "重复", "targets": [1942], "gids": [57], "n_t": 1}, {"i": 1181, "u": "72cc13e9-c02f-4c7a-b4cc-48796d67e426", "src": "重复", "targets": [1427], "gids": [5], "n_t": 1}, {"i": 890, "u": "43d69f3b-f064-4ea7-9b20-55ef7a2bbb36", "src": "重复", "targets": [992], "gids": [20], "n_t": 1}, {"i": 1527, "u": "d292c73b-f493-4bd7-a4dd-fd2e38b99428", "src": "重复", "targets": [1950], "gids": [142], "n_t": 1}, {"i": 1303, "u": "50854ed0-056a-4d95-843b-7546373c72d5", "src": "重复", "targets": [1701], "gids": [44], "n_t": 1}, {"i": 4, "u": "1fe4c008-9a49-4b62-9f64-462bc397bf74", "src": "重复", "targets": [1363], "gids": [128], "n_t": 1}];
const STORE = 'audit_clique_v4';
const BCOLORS = ['#1677ff', '#52c41a', '#fa8c16', '#722ed1', '#13c2c2', '#eb2f96', '#a0d911', '#2f54eb'];
let state = {};
let cur = 0;
let curBatch = {};   // cid -> 当前批号
let viewMode = {};   // cid -> 'all' | 批号 (筛选视图)
let bBad = {};       // boundary uuid -> 误报

try { var t = localStorage.getItem(STORE); if (t) state = JSON.parse(t); } catch(e) {}
function save() { try { localStorage.setItem(STORE, JSON.stringify(state)); } catch(e) {} }
try { var t2 = localStorage.getItem(STORE + '_b'); if (t2) bBad = JSON.parse(t2); } catch(e) {}
function saveB() { try { localStorage.setItem(STORE + '_b', JSON.stringify(bBad)); } catch(e) {} }

function bcolor(n) { return BCOLORS[(n - 1) % BCOLORS.length]; }

function flashHint(cid, text) {
  const meta = document.querySelector('.cluster[data-ci="' + cid + '"] .meta');
  if (!meta) return;
  const orig = meta.textContent;
  meta.textContent = text;
  meta.style.color = '#ff4d4f';
  meta.style.fontWeight = '700';
  setTimeout(function() {
    meta.textContent = orig;
    meta.style.color = '';
    meta.style.fontWeight = '';
  }, 2500);
}

function buildGroupHTML(c, i) {
  const st = state[c.id] || {};
  const j = st.j || 'skip';
  if (!curBatch[c.id]) curBatch[c.id] = 1;
  let batches = st.batches || {};
  let bads = st.bads || [];
  let grid = '';
  c.imgs.forEach((img, ii) => {
    let bc = '', cls = '';
    let inB = null;
    for (let k in batches) if (batches[k].includes(ii)) inB = k;
    if (inB) { cls = 'in-batch'; bc = 'style="--bc:' + bcolor(+inB) + '"'; }
    if (bads.includes(ii)) cls = 'bad';
    // 筛选视图: 非当前批的图置灰 (误报筛选: 只看误报)
    const vm = viewMode[c.id];
    if (vm === 'bad') {
      if (!bads.includes(ii)) cls += ' dim';
    } else if (vm && vm !== 'all' && !(inB === String(vm))) {
      cls += ' dim';
    }
    const sCls = img.src === '正常' ? 'normal' : 'repeat';
    grid += '<div class="cell ' + cls + '" data-ci="' + c.id + '" data-ii="' + ii + '" ' + bc + '>'
         + '<img src="' + img.url + '" alt="">'
         + '<span class="s ' + sCls + '">' + img.src + '</span>'
         + '<span class="d">x' + img.deg + '</span>'
         + '<span class="b" ' + bc + '>' + (inB ? '批' + inB : '') + '</span>'
         + '<span class="x">误报</span></div>';
  });
  let bsum = [];
  for (let k in batches) bsum.push('批' + k + ':' + batches[k].length);
  if (bads.length) bsum.push('误报:' + bads.length);
  const bc2 = bads.length ? '<span class="tag-bad" style="display:inline-block">误报 ' + bads.length + '</span>' : '';
  let batchbar = '';
  // 只显示"有图的批 + 当前批(可能为空, 用户正在加图)"——空批不显示按钮
  let batchKeys = Object.keys(batches).map(Number).sort((a, b) => a - b);
  const cb = curBatch[c.id] || 1;
  if (!batchKeys.includes(cb)) batchKeys.push(cb);
  batchKeys.sort((a, b) => a - b);
  batchbar += '<span class="bball' + ((viewMode[c.id] || 'all') === 'all' ? ' sel' : '') + '" data-ci="' + c.id + '">全部</span>';
  batchKeys.forEach(k => {
    batchbar += '<span class="bb' + (cb === k ? ' selb' : '') + (viewMode[c.id] === k ? ' selview' : '') + '" data-b="' + k + '" data-ci="' + c.id + '" style="--bc:' + bcolor(k) + '">批' + k + '<span class="bdel" data-b="' + k + '" data-ci="' + c.id + '" title="删除此批">×</span></span>';
  });
  if (bads.length) {
    batchbar += '<span class="bbad' + (viewMode[c.id] === 'bad' ? ' sel' : '') + '" data-ci="' + c.id + '">误报' + bads.length + '</span>';
  }
  return '<div class="cluster' + (j !== 'skip' ? ' done-' + j : '') + '" id="cl' + i + '" data-ci="' + c.id + '">'
      + '<div class="c-head"><span class="title">组 #' + c.id + ' · ' + c.n + ' 张</span>'
      + '<span class="tag-n">正常 ' + c.n_normal + '</span><span class="tag-r">重复 ' + c.n_dup + '</span>'
      + bc2 + '<span class="meta">' + (bsum.join(' ') || '未标注') + '</span></div>'
      + '<div class="btns" data-ci="' + c.id + '">'
      + '<span class="batchbar">' + batchbar + '</span>'
      + '<button class="newb" data-v="newb">＋ 新一批</button>'
      + '<button class="ok" data-v="true">✓ 整组正确</button>'
      + '<button class="no" data-v="false">✗ 整组误报</button>'
      + '<button class="skip" data-v="skip">跳过</button></div>'
      + '<div class="grid">' + grid + '</div></div>';
}

function renderGroup(cid) {
  const idx = DATA.findIndex(x => x.id === cid);
  if (idx < 0) return;
  const el = document.getElementById('cl' + idx);
  if (el) el.outerHTML = buildGroupHTML(DATA[idx], idx);
}

// 只重建批号按钮条 (不重建 grid/cells, 保持 cell 引用有效)
function renderBatchbar(cid) {
  const bar = document.querySelector('.btns[data-ci="' + cid + '"] .batchbar');
  if (!bar) return;
  const c = DATA.find(x => x.id === cid);
  if (!c) return;
  const st = state[cid] || {};
  const batches = st.batches || {};
  const bads = st.bads || [];
  const cb = curBatch[cid] || 1;
  let batchKeys = Object.keys(batches).map(Number).sort((a, b) => a - b);
  if (!batchKeys.includes(cb)) batchKeys.push(cb);
  batchKeys.sort((a, b) => a - b);
  let html = '<span class="bball' + ((viewMode[cid] || 'all') === 'all' ? ' sel' : '') + '" data-ci="' + cid + '">全部</span>';
  batchKeys.forEach(k => {
    html += '<span class="bb' + (cb === k ? ' selb' : '') + (viewMode[cid] === k ? ' selview' : '') + '" data-b="' + k + '" data-ci="' + cid + '" style="--bc:' + bcolor(k) + '">批' + k + '<span class="bdel" data-b="' + k + '" data-ci="' + cid + '" title="删除此批">×</span></span>';
  });
  if (bads.length) {
    html += '<span class="bbad' + (viewMode[cid] === 'bad' ? ' sel' : '') + '" data-ci="' + cid + '">误报' + bads.length + '</span>';
  }
  bar.innerHTML = html;
}

function render() {
  const list = document.getElementById('list');
  list.innerHTML = '';
  DATA.forEach((c, i) => {
    const el = document.createElement('div');
    el.outerHTML = '';
    el.insertAdjacentHTML('afterbegin', buildGroupHTML(c, i));
    list.appendChild(el.firstElementChild);
  });
  const bl = document.getElementById('boundaryList');
  bl.innerHTML = '';
  BOUNDARY.forEach(b => {
    const src_sub = b.src === '正常' ? '正常' : '重复';
    const badCls = bBad[b.u] ? ' bb-bad' : '';
    const cell = document.createElement('div');
    cell.className = 'bcell' + badCls;
    cell.dataset.u = b.u;
    cell.innerHTML = '<img src="./' + src_sub + '/' + b.u + '.jpg">'
      + '<div class="info">#' + b.i + ' ' + b.src + ' · 连 ' + b.n_t + ' 张 → 组 ' + b.gids.join(',') + '</div>'
      + '<div class="bmark" style="display:' + (bBad[b.u] ? 'block' : 'none') + '">误报</div>';
    bl.appendChild(cell);
  });
  updateStats();
  scrollTo(cur);
}

function toggleBBad(u) {
  if (bBad[u]) delete bBad[u]; else bBad[u] = true;
  saveB();
  const cell = document.querySelector('.bcell[data-u="' + u + '"]');
  if (cell) {
    cell.classList.toggle('bb-bad', !!bBad[u]);
    const mk = cell.querySelector('.bmark');
    if (mk) mk.style.display = bBad[u] ? 'block' : 'none';
  }
}

function updateStats() {
  const n = Object.keys(state).length;
  document.getElementById('bar').style.width = (n / DATA.length * 100) + '%';
  document.getElementById('stats').textContent = n + '/' + DATA.length;
  const hint = document.getElementById('savedHint');
  if (hint) hint.textContent = n > 0 ? '当前已标注 ' + n + ' 组（已自动保存）' : '尚未标注（记录会自动保存，勿清浏览器缓存）';
}

function rerenderCell(cid, ii) {
  const c = DATA.find(x => x.id === cid);
  const st = state[cid] || {};
  const batches = st.batches || {};
  const bads = st.bads || [];
  const cell = document.querySelector('.cell[data-ci="' + cid + '"][data-ii="' + ii + '"]');
  if (!cell) return;
  let inB = null;
  for (let k in batches) if (batches[k].includes(ii)) inB = k;
  cell.className = 'cell' + (inB ? ' in-batch' : '') + (bads.includes(ii) ? ' bad' : '');
  if (inB) cell.style.setProperty('--bc', bcolor(+inB)); else cell.style.removeProperty('--bc');
  const b = cell.querySelector('.b');
  if (b) { b.style.display = inB ? 'block' : 'none'; b.textContent = inB ? '批' + inB : ''; if (inB) b.style.setProperty('--bc', bcolor(+inB)); }
  const x = cell.querySelector('.x');
  if (x) x.style.display = bads.includes(ii) ? 'block' : 'none';
  // 组头统计刷新
  const head = document.querySelector('.cluster[data-ci="' + cid + '"] .meta');
  if (head) {
    let bsum = [];
    for (let k in batches) bsum.push('批' + k + ':' + batches[k].length);
    if (bads.length) bsum.push('误报:' + bads.length);
    head.textContent = bsum.join(' ') || '未标注';
  }
  // 判定类别
  const el = document.querySelector('.cluster[data-ci="' + cid + '"]');
  if (el) {
    const st2 = state[cid] || {};
    if (!st2.j || st2.j === 'skip') el.className = 'cluster';
    else el.className = 'cluster done-' + st2.j;
  }
}

function toggleBatch(cid, ii) {
  const st = state[cid] || {};
  st.batches = st.batches || {};
  st.bads = st.bads || [];
  const b = curBatch[cid] || 1;
  // 图已在其他批 -> 不移动 (保护原批, 防止误清空)
  let inOther = null;
  for (let k in st.batches) {
    if (k !== String(b) && st.batches[k].includes(ii)) { inOther = k; break; }
  }
  if (inOther) {
    flashHint(cid, '⚠ 该图在批' + inOther + '：先点批' + inOther + '取消它，再点回本批加入');
    return;
  }
  const inCur = (st.batches[b] || []).includes(ii);
  // 从所有批移除
  for (let k in st.batches) {
    const arr = st.batches[k];
    const p = arr.indexOf(ii);
    if (p >= 0) arr.splice(p, 1);
    if (!arr.length) delete st.batches[k];
  }
  // 从误报移除
  const pb = st.bads.indexOf(ii);
  if (pb >= 0) st.bads.splice(pb, 1);
  if (!inCur) {
    // 不在当前批 -> 加入
    st.batches[b] = st.batches[b] || [];
    st.batches[b].push(ii);
  }
  // inCur=true -> 已移除, 不重新加入 (即取消选中)
  st.j = 'custom';
  state[cid] = st;
  // 该组已无任何标注 -> 回到未审状态
  if (!Object.keys(st.batches).length && !st.bads.length) {
    delete state[cid];
  }
  save();
  rerenderCell(cid, ii);
  renderBatchbar(cid);
  updateStats();
}

function toggleBad(cid, ii) {
  const st = state[cid] || {};
  st.batches = st.batches || {};
  st.bads = st.bads || [];
  for (let k in st.batches) {
    const arr = st.batches[k];
    const p = arr.indexOf(ii);
    if (p >= 0) arr.splice(p, 1);
    if (!arr.length) delete st.batches[k];
  }
  const pb = st.bads.indexOf(ii);
  if (pb >= 0) st.bads.splice(pb, 1); else st.bads.push(ii);
  st.j = 'custom';
  state[cid] = st;
  if (!Object.keys(st.batches).length && !st.bads.length) {
    delete state[cid];
  }
  save();
  rerenderCell(cid, ii);
  renderBatchbar(cid);
  updateStats();
}

function setJudgement(cid, j) {
  const st = state[cid] || {};
  st.j = j;
  state[cid] = st;
  save(); updateStats();
  const el = document.querySelector('.cluster[data-ci="' + cid + '"]');
  if (el) el.className = 'cluster done-' + j;
}

document.getElementById('list').addEventListener('click', function(e) {
  const bdel = e.target.closest('.bdel');
  const btn = e.target.closest('button[data-v]');
  const bb = e.target.closest('.bb');
  const bball = e.target.closest('.bball');
  const bbad = e.target.closest('.bbad');
  const cell = e.target.closest('.cell');
  if (bdel) {
    const cid = +bdel.dataset.ci;
    const bnum = +bdel.dataset.b;
    const st = state[cid] || {};
    if (st.batches) delete st.batches[bnum];
    if (!Object.keys(st.batches || {}).length && !(st.bads || []).length) delete state[cid];
    else st.j = 'custom';
    if (curBatch[cid] === bnum) {
      const keys = Object.keys((state[cid] || {}).batches || {}).map(Number);
      curBatch[cid] = keys.length ? Math.max(...keys) : 1;
    }
    save(); updateStats(); renderGroup(cid);
    return;
  }
  if (btn) {
    const cid = +btn.parentElement.dataset.ci;
    if (btn.dataset.v === 'newb') {
      const st = state[cid] || {};
      const maxB = Math.max(curBatch[cid] || 1, ...Object.keys(st.batches || {}).map(Number));
      curBatch[cid] = maxB + 1;
      renderGroup(cid); return;
    }
    setJudgement(cid, btn.dataset.v);
  } else if (bb) {
    const cid = +bb.dataset.ci;
    curBatch[cid] = +bb.dataset.b;
    viewMode[cid] = +bb.dataset.b;
    renderGroup(cid);
  } else if (bball) {
    const cid = +bball.dataset.ci;
    viewMode[cid] = 'all';
    renderGroup(cid);
  } else if (bbad) {
    const cid = +bbad.dataset.ci;
    viewMode[cid] = 'bad';
    renderGroup(cid);
  } else if (cell) {
    toggleBatch(+cell.dataset.ci, +cell.dataset.ii);
  }
});

document.getElementById('list').addEventListener('contextmenu', function(e) {
  const cell = e.target.closest('.cell');
  if (cell) {
    e.preventDefault();
    toggleBad(+cell.dataset.ci, +cell.dataset.ii);
  }
});

document.getElementById('boundaryList').addEventListener('click', function(e) {
  const bcell = e.target.closest('.bcell');
  if (bcell) toggleBBad(bcell.dataset.u);
});

document.getElementById('prevBtn').addEventListener('click', function() { cur--; scrollTo(cur); });
document.getElementById('nextBtn').addEventListener('click', function() { cur++; scrollTo(cur); });

document.addEventListener('keydown', function(e) {
  const c = DATA[cur];
  if (!c) return;
  if (e.key === '1') { setJudgement(c.id, 'true'); }
  else if (e.key === '2') { setJudgement(c.id, 'false'); }
  else if (e.key === '4') { setJudgement(c.id, 'skip'); }
  else if (e.key === 'ArrowRight') { cur++; scrollTo(cur); }
  else if (e.key === 'ArrowLeft') { cur--; scrollTo(cur); }
});

function scrollTo(i) {
  i = Math.max(0, Math.min(i, DATA.length - 1));
  const el = document.getElementById('cl' + i);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

document.getElementById('exportBtn').addEventListener('click', function() {
  const rows = DATA.map(function(c) {
    const st = state[c.id] || {};
    const batches = {};
    for (let k in (st.batches || {})) {
      batches[k] = (st.batches[k] || []).map(function(ii) { return { id: c.imgs[ii].i, uuid: c.imgs[ii].u, src: c.imgs[ii].src }; });
    }
    return { group: c.id, n: c.n, judge: st.j || '', batches: batches,
             bads: (st.bads || []).map(function(ii) { return { id: c.imgs[ii].i, uuid: c.imgs[ii].u, src: c.imgs[ii].src }; }) };
  });
  const bstate = bBad || {};
  const out = { groups: rows, boundary_bads: Object.keys(bstate).map(function(u) {
    const b = BOUNDARY.find(x => x.u === u);
    return { uuid: u, id: b ? b.i : null, src: b ? b.src : '?' };
  }) };
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'audit_result.json';
  a.click();
});

document.getElementById('resetBtn').addEventListener('click', function() {
  if (confirm('确认重置全部判定？')) { state = {}; bBad = {}; save(); saveB(); render(); }
});

render();
</script>
</body>
</html>
